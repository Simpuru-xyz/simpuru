name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No AI co-author lines
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='co-authored-by:.*(claude|anthropic|copilot|cursor|chatgpt|openai)|generated with \[?claude'
          if git log --format=%B "$BASE..$HEAD" | grep -Ei "$pattern"; then
            echo "::error::Remove AI co-author / generated-with lines from your commits (see CONTRIBUTING.md)"; exit 1
          fi
          if printf '%s' "$PR_BODY" | grep -Ei "$pattern"; then
            echo "::error::Remove AI generated-with lines from the PR description"; exit 1
          fi
