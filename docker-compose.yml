# API on a VPS: `docker compose up -d --build`. Its own project, network and data dir.
# Listens on 127.0.0.1 only; the host's reverse proxy terminates TLS for api.simpuru.xyz.
# Needs .env next to this file with SELLER_MNEMONIC and BLOCKFROST_PROJECT_ID (never commit it).
name: simpuru
services:
  api:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4021}:4021"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:4021/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  # Simpuru Shopper, the Sokosumi Coworker (apps/coworker). Opt in: `docker compose --profile coworker up -d`.
  # Host network so it reaches the API and the Masumi Payment Service on 127.0.0.1.
  coworker:
    build: .
    profiles: [coworker]
    working_dir: /app/apps/coworker
    command: ["bun", "src/index.ts"]
    env_file: coworker.env
    environment:
      STATE_PATH: /data/coworker-state.json
    volumes:
      - ./data:/data
    network_mode: host
    restart: unless-stopped
  # Dispute arbiter (apps/arbiter). Opt in: `docker compose --profile arbiter up -d`.
  # arbiter.env holds ARBITER_MNEMONIC (the key behind arbiter.keyHash), ARBITER_TOKEN and
  # BLOCKFROST_PROJECT_ID; never commit it. The API reaches it at ARBITER_URL=http://127.0.0.1:4023.
  arbiter:
    build: .
    profiles: [arbiter]
    working_dir: /app/apps/arbiter
    command: ["bun", "src/index.ts"]
    env_file: arbiter.env
    environment:
      ARBITER_STORE: /data/arbiter.json
    volumes:
      - ./data:/data
    network_mode: host
    restart: unless-stopped
